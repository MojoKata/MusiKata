# MusiKata's CI (docs/process/ci.md, docs/process/testing.md). Every pull request and push to
# master: the checks of scripts/check.sh, tier 1 in its container measured by coverage.py, and the
# coverage report against the floors and the 80 % each module of src/ needs. A v* tag: its version
# checked against __version__. The `ci` job is the one check the master ruleset requires, once it
# has passed (docs/process/genesis.md, 4). The builds, the tour and the Pages site join with the
# slices that make them (DEVELOP.md).
# Each action is pinned by its commit SHA, as the repository requires (genesis.md, 5).
name: CI
on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]
permissions:
  contents: read
defaults:
  run:
    shell: bash      # bash -eo pipefail: a script piped through tee fails the step when it fails
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ruff, mypy, the documents and the private names (development.md, "Before each commit"), then
  # tier 1 in its container, measured (testing.md, "Tiers")
  tier1:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MUSIKATA_COVERAGE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: true      # coworker/, agents/
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: github.ref_type != 'tag'
        with:
          path: |
            build/python-cache
            build/site-packages-*
          key: tier1-${{ hashFiles('packaging/versions.env') }}
      - run: COWORKER_UNATTENDED=1 coworker/bin/coworker status --no-network   # the coworker protocol, unattended
      - name: the checks
        run: |
          mkdir -p build
          py=$(sh scripts/python-standalone.sh)
          {
            "$py" -m ruff format --check . &&
            "$py" -m ruff check . &&
            "$py" -m mypy &&
            python3 scripts/doccheck.py --quiet &&
            git ls-files -z | xargs -0 sh -c 'for f; do [ -f "$f" ] && printf "%s\0" "$f"; done' sh |
              xargs -0 python3 scripts/public_text.py check
          } 2>&1 | tee build/ci-checks.log
      - if: failure()
        run: sh scripts/ci-tail.sh build/ci-checks.log checks
      - run: sh scripts/test-tier1.sh 2>&1 | tee build/ci-tier1.log
      - if: failure()
        run: sh scripts/ci-tail.sh build/ci-tier1.log test-tier1.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-data
          path: build/tier1/coverage/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # tier 1's coverage: totals by area against tests/coverage-floor.json, every module of src/ at
  # 80 %, and the changed lines no test reaches, as notices on them (scripts/coverage_report.py)
  coverage:
    needs: [tier1]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2        # the commit before: the changed lines count from it
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: github.ref_type != 'tag'
        with:
          path: build/python-cache
          key: coverage-${{ hashFiles('packaging/versions.env') }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: coverage-data
          path: build/coverage-data
      - run: |
          echo "$(ls -A build/coverage-data | wc -l) data files"
          "$(sh scripts/python-standalone.sh)" scripts/coverage_report.py report --check --data build/coverage-data 2>&1 | tee build/ci-coverage.log
      - if: failure()
        run: sh scripts/ci-tail.sh build/ci-coverage.log coverage_report.py
      # the report as HTML and as data: totals.json is what scripts/coverage_report.py floor reads
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage
          path: build/coverage/
          if-no-files-found: ignore
          retention-days: 30

  # a v* tag: the tag is __version__ (docs/process/release.md)
  version:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: |
          v=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/musikata_core/__init__.py)
          echo "tag $GITHUB_REF_NAME, __version__ $v"
          test "$GITHUB_REF_NAME" = "v$v"

  # the one check the master ruleset requires: everything above passed
  ci:
    needs: [tier1, coverage]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ needs.tier1.result }} ${{ needs.coverage.result }}
        run: |
          echo "tier1, coverage: $RESULTS"
          test "$RESULTS" = "success success"
