# MusiKata's CI (docs/process/ci.md, docs/process/testing.md). Every pull request and push to
# master: the checks of scripts/check.sh, tier 1 in its container measured by coverage.py, the
# coverage report against the floors and the 80 % each module of src/ needs, and the Pages site,
# which a push to master publishes. A v* tag: its version checked against __version__. The `ci` job
# is the one check the master ruleset requires, once it has passed (docs/process/genesis.md, 4).
# The builds and the tour join with the slices that make them (DEVELOP.md).
# Each action is pinned by its commit SHA, as the repository requires (genesis.md, 5).
name: CI
on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]
permissions:
  contents: read
defaults:
  run:
    shell: bash      # bash -eo pipefail: a script piped through tee fails the step when it fails
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ruff, mypy, the documents and the private names (development.md, "Before each commit"), then
  # tier 1 in its container, measured (testing.md, "Tiers")
  tier1:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MUSIKATA_COVERAGE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: true      # coworker/, agents/
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: github.ref_type != 'tag'
        with:
          path: |
            build/python-cache
            build/site-packages-*
          key: tier1-${{ hashFiles('packaging/versions.env') }}
      - run: COWORKER_UNATTENDED=1 coworker/bin/coworker status --no-network   # the coworker protocol, unattended
      - name: the checks
        run: |
          mkdir -p build
          py=$(sh scripts/python-standalone.sh)
          {
            "$py" -m ruff format --check . &&
            "$py" -m ruff check . &&
            "$py" -m mypy &&
            python3 scripts/doccheck.py --quiet &&
            git ls-files -z | xargs -0 sh -c 'for f; do [ -f "$f" ] && printf "%s\0" "$f"; done' sh |
              xargs -0 python3 scripts/public_text.py check
          } 2>&1 | tee build/ci-checks.log
      - if: failure()
        run: sh scripts/ci-tail.sh build/ci-checks.log checks
      - run: sh scripts/test-tier1.sh 2>&1 | tee build/ci-tier1.log
      - if: failure()
        run: sh scripts/ci-tail.sh build/ci-tier1.log test-tier1.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-data
          path: build/tier1/coverage/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # tier 1's coverage: totals by area against tests/coverage-floor.json, every module of src/ at
  # 80 %, and the changed lines no test reaches, as notices on them (scripts/coverage_report.py)
  coverage:
    needs: [tier1]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2        # the commit before: the changed lines count from it
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: github.ref_type != 'tag'
        with:
          path: build/python-cache
          key: coverage-${{ hashFiles('packaging/versions.env') }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: coverage-data
          path: build/coverage-data
      - run: |
          echo "$(ls -A build/coverage-data | wc -l) data files"
          "$(sh scripts/python-standalone.sh)" scripts/coverage_report.py report --check --data build/coverage-data 2>&1 | tee build/ci-coverage.log
      - if: failure()
        run: sh scripts/ci-tail.sh build/ci-coverage.log coverage_report.py
      # the report as HTML and as data: totals.json is what scripts/coverage_report.py floor reads
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage
          path: build/coverage/
          if-no-files-found: ignore
          retention-days: 30

  # the Pages site (docs/process/ci.md, "The Pages site"), on every run: the coverage report, the
  # history the published site holds with this commit's point added, the hardening page from the
  # repository's issues, and the screenshots, kept as the `site` artifact; `pages` publishes master's.
  # The tour's screenshots join with the tour job (slice 2.3)
  site:
    needs: [coverage]
    if: ${{ !github.event.repository.fork }}   # a fork's push builds no site: it would carry the fork's name
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read        # the releases, for their tours
      actions: read         # their tags' runs' tour artifacts
      issues: read          # the hardening page reads the issues
      pull-requests: read   # and the pull requests that close them
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: coverage
          path: build/coverage
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/shots
          python3 scripts/coverage_site.py release-tours build/shots 2>&1 | tee build/ci-site.log
          python3 scripts/coverage_site.py build --screenshots build/shots 2>&1 | tee -a build/ci-site.log
          python3 scripts/public_text.py check build/site/*.html build/site/*.json build/site/screenshots/index.* 2>&1 | tee -a build/ci-site.log
      - if: failure()
        run: sh scripts/ci-tail.sh build/ci-site.log coverage_site.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: site
          path: build/site/
          if-no-files-found: error
          retention-days: 30

  # a push to master only, once `ci` passes: the site to the repository's GitHub Pages; the
  # github-pages environment takes deployments from master alone (genesis.md, 8)
  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && !github.event.repository.fork
    needs: [ci, site]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: site
          path: site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site/
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

  # a v* tag: the tag is __version__ (docs/process/release.md)
  version:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: |
          v=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/musikata_core/__init__.py)
          echo "tag $GITHUB_REF_NAME, __version__ $v"
          test "$GITHUB_REF_NAME" = "v$v"

  # the one check the master ruleset requires: everything above passed
  ci:
    needs: [tier1, coverage]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ needs.tier1.result }} ${{ needs.coverage.result }}
        run: |
          echo "tier1, coverage: $RESULTS"
          test "$RESULTS" = "success success"
