# MusiKata's package, and its tools' settings (docs/process/coding.md, "Style and types";
# docs/process/testing.md). The versions are pinned in packaging/versions.env, not here: these say
# only what it needs.

[project]
name = "musikata"
dynamic = ["version"]
description = "A music player and organizer whose library is its files"
license = "GPL-3.0-or-later"
requires-python = ">=3.14"          # the Python the release carries: packaging/versions.env (R1.2)
dependencies = [
    "PySide6-Essentials>=6.12",
    "PySide6-Addons>=6.12",
    "mutagen>=1.48",
    "numpy>=2.5",
    "av>=19",
    "truststore>=0.10",
]

[project.scripts]
musikata = "musikata.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "musikata_core.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
musikata_core = ["schemas/*.json"]
musikata = ["qml/*"]

[tool.ruff]
line-length = 100
# the mockup renderer draws the design, it isn't MusiKata: written dense, before these rules;
# the submodules are their own projects
extend-exclude = ["docs/mockups/src", "agents", "coworker"]
# the scripts run on the system's python3 as well as the release's (Ubuntu 24.04's is 3.12), so
# ruff keeps their syntax to 3.12's: no unparenthesized `except A, B:`
per-file-target-version = {"scripts/**/*.py" = "py312"}

[tool.ruff.lint]
# pyflakes, pycodestyle's errors, import order, bugbear, pyupgrade, simplify
select = ["F", "E", "I", "B", "UP", "SIM"]

[tool.mypy]
files = ["src"]
python_version = "3.14"

[[tool.mypy.overrides]]
module = ["musikata_core", "musikata_core.*"]
strict = true

[[tool.mypy.overrides]]
module = ["mutagen", "mutagen.*", "av", "av.*"]
ignore_missing_imports = true       # neither ships type information

[[tool.mypy.overrides]]
# the edges that hand Mutagen's objects on as plain data (docs/process/coding.md): Mutagen's own
# methods carry no types, so calling them is allowed there, and nowhere else in the core
module = ["musikata_core.tags.read"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["musikata", "musikata.*"]
disallow_untyped_defs = true       # the Qt bridge's looseness is allowed, and nothing else

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: over 100 ms; left out of the fast set (docs/process/testing.md, \"Speed\")"]

[tool.coverage.run]
source = ["src", "scripts"]
branch = true
parallel = true
relative_files = true
concurrency = ["thread", "multiprocessing"]
patch = ["subprocess"]

[tool.coverage.paths]
src = ["src/", "/src/src/"]
scripts = ["scripts/", "/src/scripts/"]
